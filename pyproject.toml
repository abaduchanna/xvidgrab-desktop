[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "XVidGrab-Desktop"
version = "1.0.0"
description = "Free & open GUI video downloader for X (Twitter) - paste a link, pick videos from thumbnails, download at max resolution. List and grid views."
requires-python = ">=3.9"
authors = [
    { name = "Abad Umair Channa" }
]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
qt = ["PySide6>=6.7.0"]

[tool.setuptools]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
