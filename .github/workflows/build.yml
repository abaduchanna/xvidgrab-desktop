name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Byte-compile all sources
        run: python -m py_compile xgrab_core.py xvidgrab_desktop.py xvidgrab_desktop_qt.py

  build:
    needs: test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: xvidgrab_desktop
            exe: XVidGrab-Desktop
          - app: xvidgrab_desktop_qt
            exe: XVidGrab-Desktop-Qt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE from .spec
        shell: bash
        run: |
          python -m PyInstaller "${{ matrix.app }}.spec" --noconfirm --clean
          if [ ! -f "dist/${{ matrix.exe }}.exe" ]; then
            echo "::error::Build failed - dist/${{ matrix.exe }}.exe not found"
            exit 1
          fi
          ls -la dist/

      - name: Smoke-test packaged EXE startup
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist/${{ matrix.exe }}.exe"
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Packaged EXE exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

      # Code signing (sigstore)
      - name: Install sigstore
        run: python -m pip install sigstore

      - name: Sign EXE files with sigstore
        shell: bash
        run: |
          cd dist
          for exe in *.exe; do
            if [ -f "$exe" ]; then
              echo "Signing $exe..."
              python -m sigstore sign "$exe" || echo "WARNING: sigstore failed"
            fi
          done
        continue-on-error: true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: exe-${{ matrix.app }}
          path: dist/${{ matrix.exe }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all EXEs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded EXEs
        id: list_artifacts
        run: |
          ls -la dist/
          {
            echo "files<<EOF"
            for f in dist/*.exe; do
              echo "- $(basename "$f")"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release with build number
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XVidGrab Desktop Build ${{ github.run_number }}
          body: |
            Automated build #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Artifacts:
            ${{ steps.list_artifacts.outputs.files }}
          files: dist/*.exe
          make_latest: true
